services:
  v2ray:
    image: v2fly/v2fly-core:latest
    restart: always
    command: ["run", "-c", "/etc/v2ray/config.json"]
    volumes:
      - ./config/config.json:/etc/v2ray/config.json:ro

  web-server:
    build:
      context: ./build/web-server
      args:
        CADDY_MODULES: ${CADDY_MODULES:-}
    image: web-server:latest
    restart: always
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    depends_on:
      - v2ray
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
